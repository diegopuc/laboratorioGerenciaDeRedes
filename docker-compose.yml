services:
  postgres:
    image: postgres:16-alpine
    container_name: lab-postgres
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_lab_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      labnet:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.4-latest
    container_name: lab-zabbix-server
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_lab_2026
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      labnet:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4-latest
    container_name: lab-zabbix-web
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_lab_2026
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    ports:
      - "${ZABBIX_WEB_PORT:-8090}:8080"
    networks:
      labnet:
        ipv4_address: 172.28.0.12
    restart: unless-stopped

  arch01:
    build: ./arch
    container_name: lab-arch01
    hostname: arch01
    environment:
      LAB_HOSTNAME: arch01
      LAB_ROLE: Servidor Web
      LAB_LOCATION: Laboratorio 01
    cap_add:
      - NET_ADMIN
    networks:
      labnet:
        ipv4_address: 172.28.0.21
    healthcheck:
      test: ["CMD-SHELL", "pgrep zabbix_agentd >/dev/null && curl -fsS http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  arch02:
    build: ./arch
    container_name: lab-arch02
    hostname: arch02
    environment:
      LAB_HOSTNAME: arch02
      LAB_ROLE: Servidor de Dados
      LAB_LOCATION: Datacenter A
    cap_add:
      - NET_ADMIN
    networks:
      labnet:
        ipv4_address: 172.28.0.22
    healthcheck:
      test: ["CMD-SHELL", "pgrep zabbix_agentd >/dev/null && curl -fsS http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  arch03:
    build: ./arch
    container_name: lab-arch03
    hostname: arch03
    environment:
      LAB_HOSTNAME: arch03
      LAB_ROLE: Servidor de Arquivos
      LAB_LOCATION: Datacenter B
    cap_add:
      - NET_ADMIN
    networks:
      labnet:
        ipv4_address: 172.28.0.23
    healthcheck:
      test: ["CMD-SHELL", "pgrep zabbix_agentd >/dev/null && curl -fsS http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  labnet:
    name: laboratorio-gerencia
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
